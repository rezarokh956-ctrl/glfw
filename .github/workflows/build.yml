name: Build Windows App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\DocScanApp\DocScanApp.csproj

      - name: Publish (self-contained single file)
        run: dotnet publish .\DocScanApp\DocScanApp.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:PublishTrimmed=false

      - name: Zip artifact
        shell: pwsh
        run: |
          $pub = ".\DocScanApp\bin\Release\net8.0-windows\win-x64\publish"
          Compress-Archive -Path "$pub\*" -DestinationPath "DocScanApp-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanApp-win-x64
          path: DocScanApp-win-x64.zip
